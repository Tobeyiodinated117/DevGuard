labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Ask questions about DevGuard installation, configuration, scan results, or CI/CD integration.

        For account issues, contact [support@pentesterra.com](mailto:support@pentesterra.com).
  - type: textarea
    id: question
    attributes:
      label: Your question
      placeholder: Describe what you're trying to do and what's unclear
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevGuard version
      placeholder: e.g. 5.6.0
